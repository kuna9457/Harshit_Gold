services:
  - type: web
    name: harshit-gold
    runtime: python
    plan: free
    region: frankfurt   # Binance blocks US servers (HTTP 451); keep this outside the US
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI   # paste your MongoDB Atlas connection string in the Render dashboard; without it settings live on the temporary disk
        sync: false
